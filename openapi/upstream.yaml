openapi: "3.0.3"
info:
  title: qarib-api
  description: |
    qarib-api is a read-only content delivery API that surfaces Islamic-event data
    (event series, occurrences, places, asatidzs, references, subjects, authors, regions)
    to mobile and web clients.

    All domain resource endpoints are **public** (no authentication required).
    Authentication endpoints (`/auth/*`) are provided for CMS operator tooling only.

    Write operations (create/update/delete) are owned exclusively by the CMS
    (qarib-dashboard) and are not exposed here.
  version: "1.0.0"
  contact:
    name: qarib-api
    url: https://github.com/14mdzk/qarib-api

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Health
    description: Liveness and readiness probes
  - name: Auth
    description: Authentication — login, token refresh, logout
  - name: Users
    description: |
      Authenticated read-only user lookup for CMS operator tooling. User
      lifecycle (create/update/deactivate) is owned by the CMS (qarib-dashboard);
      this API only reads.
  - name: Events
    description: Event series and occurrence (recurring) endpoints
  - name: Regions
    description: Administrative region reference data
  - name: Authors
    description: Author reference data
  - name: Subjects
    description: Subject (topic) reference data
  - name: Asatidzs
    description: Asatidz (Islamic scholar) reference data
  - name: Places
    description: Venue / place reference data
  - name: References
    description: Book / reference material data

paths:
  # ── Health ──────────────────────────────────────────────────────────────
  /healthz/live:
    get:
      operationId: livenessCheck
      tags: [Health]
      summary: Liveness check
      description: |
        Checks whether the application process is alive. Always returns 200.
        Does not probe any dependency. Use as a Kubernetes liveness probe target.
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessResponse"

  /healthz/ready:
    get:
      operationId: readinessCheck
      tags: [Health]
      summary: Readiness check
      description: |
        Runs all dependency sub-checks (Postgres, Redis, …) in parallel under a
        configurable deadline (default 2 s). Returns 200 when every check passes,
        503 when any check fails. NoOp adapters report `<name>(noop)` and always pass.
        Use as a Kubernetes readiness probe target.
      responses:
        "200":
          description: All dependency checks passed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: One or more dependency checks failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"

  /health:
    get:
      operationId: healthCheckAlias
      tags: [Health]
      summary: Liveness check (deprecated alias)
      description: |
        Deprecated back-compat alias for `/healthz/live`. Kept for existing probes.
        Migrate to `/healthz/live`.
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessResponse"

  # ── Auth ────────────────────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Login
      description: |
        Authenticates a user with email and password, returning a JWT access token
        and a refresh token.

        This endpoint is rate-limited to **20 requests per 5 minutes per IP**
        (fail-closed: returns 503 when the Redis rate-limit backend is unavailable).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [Auth]
      summary: Refresh access token
      description: |
        Exchanges a valid refresh token for a new pair of access and refresh tokens.
        Only `refresh_token` is required in the body; the server resolves the user ID
        internally from the lookup key.

        Same rate limit as `/auth/login` (20 req / 5 min per IP, fail-closed).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Token refreshed
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RefreshResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Logout
      description: |
        Invalidates the given refresh token. Requires a valid JWT access token in
        the `Authorization: Bearer` header. The caller ID is extracted from the JWT
        claims server-side; it is not accepted in the request body.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "200":
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Users ───────────────────────────────────────────────────────────────
  /users/me:
    get:
      operationId: getCurrentUser
      tags: [Users]
      summary: Get current user
      description: |
        Returns the profile of the authenticated caller, resolved from the JWT
        access token. Requires a valid `Authorization: Bearer` token; no
        additional permission is required beyond authentication.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /users:
    get:
      operationId: listUsers
      tags: [Users]
      summary: List users
      description: |
        Returns a cursor-paginated list of users. Requires a valid JWT and the
        `users:read` permission (enforced via Casbin against the caller's role).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: search
          in: query
          description: Search by name or email (partial match)
          schema:
            type: string
        - name: email
          in: query
          description: Exact email match
          schema:
            type: string
            format: email
        - name: is_active
          in: query
          description: Filter by active status
          schema:
            type: boolean
      responses:
        "200":
          description: Paginated list of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedUserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /users/{id}:
    get:
      operationId: getUserByID
      tags: [Users]
      summary: Get user by ID
      description: |
        Returns a single user by ID. Requires a valid JWT and the `users:read`
        permission (enforced via Casbin against the caller's role).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Regions ─────────────────────────────────────────────────────────────
  /regions:
    get:
      operationId: listRegions
      tags: [Regions]
      summary: List regions
      description: Returns a cursor-paginated list of administrative regions. Public endpoint.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: search
          in: query
          description: Search by region name (partial match)
          schema:
            type: string
        - name: parent
          in: query
          description: Parent region code to filter children (e.g. "32" for cities in West Java)
          schema:
            type: string
      responses:
        "200":
          description: Paginated list of regions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedRegionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /regions/{id}:
    get:
      operationId: getRegionByID
      tags: [Regions]
      summary: Get region by ID
      description: Returns a single region by its ID. Public endpoint.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Region found
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RegionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Events ──────────────────────────────────────────────────────────────
  /events:
    get:
      operationId: listRecurrings
      tags: [Events]
      summary: List event occurrences
      description: |
        Returns a cursor-paginated discovery list of event occurrences (recurrings).
        Supports filtering by event series, place, asatidz, subject, status, and date range.
        Public endpoint.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/ExpandPlaceAsatidz"
        - name: event_id
          in: query
          description: Filter by event series UUID
          schema:
            type: string
            format: uuid
        - name: place_id
          in: query
          description: Filter by place UUID
          schema:
            type: string
            format: uuid
        - name: asatidz_id
          in: query
          description: Filter by asatidz UUID
          schema:
            type: string
            format: uuid
        - name: subject_id
          in: query
          description: Filter by subject UUID
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          description: "Filter by occurrence status (integer)"
          schema:
            type: integer
        - name: date_from
          in: query
          description: "Filter occurrences on or after this date-time (RFC3339)"
          schema:
            type: string
            format: date-time
        - name: date_to
          in: query
          description: "Filter occurrences on or before this date-time (RFC3339)"
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Paginated list of event occurrences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedEventRecurringResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /events/nearby:
    get:
      operationId: listNearbyEvents
      tags: [Events]
      summary: Spatial event discovery
      description: |
        Returns a cursor-paginated list of upcoming event occurrences near a geographic
        point. Provide either (`lat` + `lng`) for point-based search or `region_id` for
        region-based search (or both). `radius_km` defaults to a server-side value when
        omitted; max 100 km. Public endpoint.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/ExpandPlaceAsatidz"
        - name: limit
          in: query
          description: "Number of items per page (default: 20, max: 200)"
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
        - name: lat
          in: query
          description: Latitude of the search origin (decimal degrees, WGS-84)
          schema:
            type: number
            format: double
        - name: lng
          in: query
          description: Longitude of the search origin (decimal degrees, WGS-84)
          schema:
            type: number
            format: double
        - name: radius_km
          in: query
          description: "Search radius in kilometres (min: 0.1, max: 100)"
          schema:
            type: number
            format: double
            minimum: 0.1
            maximum: 100
        - name: region_id
          in: query
          description: Filter by region UUID (alternative / complement to lat/lng)
          schema:
            type: string
            format: uuid
        - name: subject_id
          in: query
          description: Filter by subject UUID
          schema:
            type: string
            format: uuid
        - name: date_from
          in: query
          description: "Filter occurrences on or after this date-time (RFC3339)"
          schema:
            type: string
            format: date-time
        - name: date_to
          in: query
          description: "Filter occurrences on or before this date-time (RFC3339)"
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Paginated list of nearby event occurrences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedEventRecurringResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /events/{id}:
    get:
      operationId: getRecurring
      tags: [Events]
      summary: Get event occurrence by ID
      description: |
        Returns a single event occurrence (recurring) by its integer ID. Public endpoint.
        Returns 404 when the ID is not a valid integer or the occurrence does not exist.
      parameters:
        - name: id
          in: path
          required: true
          description: Event occurrence integer ID
          schema:
            type: integer
            format: int64
        - $ref: "#/components/parameters/ExpandPlaceAsatidz"
      responses:
        "200":
          description: Event occurrence found
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/EventRecurringResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /events/series/by-id/{id}:
    get:
      operationId: getSeriesByID
      tags: [Events]
      summary: Get event series by UUID
      description: Returns the event series template for the given UUID. Public endpoint.
      parameters:
        - name: id
          in: path
          required: true
          description: Event series UUID
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/ExpandPlaceAsatidz"
      responses:
        "200":
          description: Event series found
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/EventSeriesResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /events/series/{slug}:
    get:
      operationId: getSeriesBySlug
      tags: [Events]
      summary: Get event series by slug
      description: Returns the event series template for the given slug. Public endpoint.
      parameters:
        - name: slug
          in: path
          required: true
          description: Event series slug
          schema:
            type: string
        - $ref: "#/components/parameters/ExpandPlaceAsatidz"
      responses:
        "200":
          description: Event series found
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/EventSeriesResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /events/series/{slug}/upcoming:
    get:
      operationId: listSeriesUpcoming
      tags: [Events]
      summary: List upcoming occurrences for a series
      description: |
        Returns a cursor-paginated list of future event occurrences for the given series.
        Public endpoint.
      parameters:
        - name: slug
          in: path
          required: true
          description: Event series slug
          schema:
            type: string
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/ExpandPlaceAsatidz"
      responses:
        "200":
          description: Paginated list of upcoming occurrences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedEventRecurringResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /events/series/{slug}/recurrings:
    get:
      operationId: listSeriesRecurrings
      tags: [Events]
      summary: List all occurrences for a series
      description: |
        Returns a cursor-paginated list of all event occurrences (past and future)
        for the given series. Public endpoint.
      parameters:
        - name: slug
          in: path
          required: true
          description: Event series slug
          schema:
            type: string
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/ExpandPlaceAsatidz"
      responses:
        "200":
          description: Paginated list of all occurrences for the series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedEventRecurringResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Authors ─────────────────────────────────────────────────────────────
  /authors:
    get:
      operationId: listAuthors
      tags: [Authors]
      summary: List authors
      description: Returns a cursor-paginated list of authors. Public endpoint.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: search
          in: query
          description: Search by name or slug (partial match)
          schema:
            type: string
        - name: is_active
          in: query
          description: Filter by active status
          schema:
            type: boolean
      responses:
        "200":
          description: Paginated list of authors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedAuthorResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /authors/{id}:
    get:
      operationId: getAuthorByID
      tags: [Authors]
      summary: Get author by ID
      description: Returns a single author by their UUID. Public endpoint.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Author found
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AuthorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Subjects ────────────────────────────────────────────────────────────
  /subjects:
    get:
      operationId: listSubjects
      tags: [Subjects]
      summary: List subjects
      description: Returns a cursor-paginated list of subjects (Islamic topics). Public endpoint.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: search
          in: query
          description: Search by name or slug (partial match)
          schema:
            type: string
        - name: is_active
          in: query
          description: Filter by active status
          schema:
            type: boolean
      responses:
        "200":
          description: Paginated list of subjects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedSubjectResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /subjects/{id}:
    get:
      operationId: getSubjectByID
      tags: [Subjects]
      summary: Get subject by ID
      description: Returns a single subject by its UUID. Public endpoint.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Subject found
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SubjectResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Asatidzs ────────────────────────────────────────────────────────────
  /asatidzs:
    get:
      operationId: listAsatidzs
      tags: [Asatidzs]
      summary: List asatidzs
      description: Returns a cursor-paginated list of asatidzs (Islamic scholars). Public endpoint.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: search
          in: query
          description: Search by name or slug (partial match)
          schema:
            type: string
        - name: gender
          in: query
          description: "Filter by gender (1 = Male, 2 = Female)"
          schema:
            type: integer
            enum: [1, 2]
        - name: is_active
          in: query
          description: Filter by active status
          schema:
            type: boolean
      responses:
        "200":
          description: Paginated list of asatidzs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedAsatidzResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /asatidzs/{id}:
    get:
      operationId: getAsatidzByID
      tags: [Asatidzs]
      summary: Get asatidz by ID
      description: Returns a single asatidz by their UUID. Public endpoint.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Asatidz found
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AsatidzResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Places ──────────────────────────────────────────────────────────────
  /places:
    get:
      operationId: listPlaces
      tags: [Places]
      summary: List places
      description: |
        Returns a cursor-paginated list of venues / places. Supports filtering by region
        and optional spatial search (provide all three of `near_lat`, `near_lng`,
        `radius_km` for nearby filtering). Public endpoint.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: search
          in: query
          description: Search by name or slug (partial match)
          schema:
            type: string
        - name: region_id
          in: query
          description: Filter by region UUID
          schema:
            type: string
            format: uuid
        - name: is_active
          in: query
          description: Filter by active status
          schema:
            type: boolean
        - name: near_lat
          in: query
          description: Latitude for spatial search (requires near_lng + radius_km)
          schema:
            type: number
            format: double
        - name: near_lng
          in: query
          description: Longitude for spatial search (requires near_lat + radius_km)
          schema:
            type: number
            format: double
        - name: radius_km
          in: query
          description: Search radius in kilometres (requires near_lat + near_lng)
          schema:
            type: number
            format: double
      responses:
        "200":
          description: Paginated list of places
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedPlaceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /places/{id}:
    get:
      operationId: getPlaceByID
      tags: [Places]
      summary: Get place by ID
      description: Returns a single place by its UUID. Public endpoint.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Place found
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PlaceResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── References ──────────────────────────────────────────────────────────
  /references:
    get:
      operationId: listReferences
      tags: [References]
      summary: List references
      description: Returns a cursor-paginated list of reference materials (books, texts). Public endpoint.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: search
          in: query
          description: Search by name or slug (partial match)
          schema:
            type: string
        - name: author_id
          in: query
          description: Filter by author UUID
          schema:
            type: string
            format: uuid
        - name: is_active
          in: query
          description: Filter by active status
          schema:
            type: boolean
      responses:
        "200":
          description: Paginated list of references
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedReferenceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /references/{id}:
    get:
      operationId: getReferenceByID
      tags: [References]
      summary: Get reference by ID
      description: Returns a single reference by its UUID. Public endpoint.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Reference found
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ReferenceResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

# ══════════════════════════════════════════════════════════════════════════
# Components
# ══════════════════════════════════════════════════════════════════════════
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token obtained from POST /auth/login

  headers:
    X-RateLimit-Limit:
      description: Maximum requests allowed in the current rate-limit window.
      schema:
        type: integer
        example: 20
    X-RateLimit-Remaining:
      description: Requests remaining in the current window.
      schema:
        type: integer
        example: 17
    X-RateLimit-Reset:
      description: Unix timestamp (seconds) at which the current window resets.
      schema:
        type: integer
        example: 1714917600

  parameters:
    ResourceID:
      name: id
      in: path
      required: true
      description: Resource UUID
      schema:
        type: string
        format: uuid
    ExpandPlaceAsatidz:
      name: expand
      in: query
      description: |
        Comma-separated list of related objects to embed inline.
        Supported values: `place`, `asatidz`. Unknown tokens are ignored.
        When omitted, only bare IDs are returned (backward-compatible default).
      required: false
      style: form
      explode: false
      schema:
        type: string
        example: "place,asatidz"
    Cursor:
      name: cursor
      in: query
      description: Opaque base64-encoded cursor for pagination (obtained from a previous response's `pagination.next_cursor` or `pagination.prev_cursor`)
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: "Number of items per page (default: 20, max: 100)"
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: Bad request or validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: VALIDATION_ERROR
              message: Validation failed
              details:
                limit: "must be between 1 and 100"
    Unauthorized:
      description: Authentication required or invalid / expired token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: UNAUTHORIZED
              message: Authentication required
    Forbidden:
      description: Authenticated but lacking the required permission
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: FORBIDDEN
              message: You do not have permission to perform this action
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: NOT_FOUND
              message: Resource not found
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        X-RateLimit-Limit:
          $ref: "#/components/headers/X-RateLimit-Limit"
        X-RateLimit-Remaining:
          $ref: "#/components/headers/X-RateLimit-Remaining"
        X-RateLimit-Reset:
          $ref: "#/components/headers/X-RateLimit-Reset"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: RATE_LIMIT_EXCEEDED
              message: Too many requests, please try again later
    ServiceUnavailable:
      description: |
        Rate-limit backend unavailable (fail-closed). Returned when the Redis
        backend is down and `FailClosed=true` is set on the rate-limit middleware.
        Applies to `/auth/login` and `/auth/refresh`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: RATE_LIMIT_ERROR
              message: Service temporarily unavailable, please try again later
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: INTERNAL_ERROR
              message: An unexpected error occurred

  schemas:
    # ── Shared response wrappers ──────────────────────────────────────────
    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          example: true
        data:
          description: Response payload (type varies per endpoint)

    MessageResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Logged out successfully

    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Machine-readable error code
              enum:
                - BAD_REQUEST
                - UNAUTHORIZED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - UNPROCESSABLE_ENTITY
                - INTERNAL_ERROR
                - SERVICE_UNAVAILABLE
                - VALIDATION_ERROR
                - RATE_LIMIT_EXCEEDED
                - RATE_LIMIT_ERROR
                - UNSUPPORTED_MEDIA_TYPE
            message:
              type: string
              description: Human-readable error message
            details:
              type: object
              additionalProperties: true
              description: Per-field validation details (present on 400 responses)

    PaginationMeta:
      type: object
      description: Cursor-based pagination metadata included in all paginated responses.
      properties:
        next_cursor:
          type: string
          nullable: true
          description: Opaque base64-encoded cursor; pass as `cursor` to fetch the next page. Absent when `has_more` is false.
        prev_cursor:
          type: string
          nullable: true
          description: Opaque base64-encoded cursor; pass as `cursor` to fetch the previous page. Absent when `has_prev` is false.
        has_more:
          type: boolean
          description: True when additional items exist after this page.
        has_prev:
          type: boolean
          description: True when items exist before this page.
        total:
          type: integer
          format: int64
          nullable: true
          description: Total item count (included when the query pre-counted; otherwise absent).

    # ── Shared domain types ───────────────────────────────────────────────
    L10nString:
      type: object
      description: |
        Localized string map keyed by IETF language code.
        Typical keys are `"id"` (Indonesian) and `"en"` (English).
        The server falls back to `"id"` then `"en"` when the requested locale is absent.
      additionalProperties:
        type: string
      example:
        id: "Tafsir Al-Quran"
        en: "Quran Exegesis"

    # ── Health ────────────────────────────────────────────────────────────
    LivenessResponse:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          enum: [alive]
          example: alive
        timestamp:
          type: string
          format: date-time

    ReadinessResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ready, degraded]
          description: "'ready' when all sub-checks pass; 'degraded' when any fail"
          example: ready
        timestamp:
          type: string
          format: date-time
        checks:
          type: object
          additionalProperties:
            type: string
          description: |
            Per-check result map. Value is "ok" on success, or a short sanitised
            error reason on failure. NoOp adapters appear as "<name>(noop)".
          example:
            database: ok
            cache(noop): ok

    # ── Auth ──────────────────────────────────────────────────────────────
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: operator@example.com
        password:
          type: string
          format: password
          example: "s3cr3tP@ss"

    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
          description: Short-lived JWT access token
        refresh_token:
          type: string
          description: Long-lived opaque refresh token
        expires_in:
          type: integer
          description: Access token lifetime in seconds
          example: 900
        token_type:
          type: string
          example: Bearer

    RefreshRequest:
      type: object
      required: [refresh_token]
      description: |
        Only `refresh_token` is required. `user_id` is not accepted.
      properties:
        refresh_token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    RefreshResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          description: Access token lifetime in seconds
          example: 900
        token_type:
          type: string
          example: Bearer

    LogoutRequest:
      type: object
      required: [refresh_token]
      description: |
        The caller ID is extracted server-side from the JWT claims (via `Authorization: Bearer`
        header). It is not accepted in the body.
      properties:
        refresh_token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    # ── User ──────────────────────────────────────────────────────────────
    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          description: Role slug used as the Casbin authorization subject (e.g. "super_admin")
        name:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PaginatedUserResponse:
      type: object
      required: [success, data, pagination]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/UserResponse"
        pagination:
          $ref: "#/components/schemas/PaginationMeta"

    # ── Region ────────────────────────────────────────────────────────────
    RegionResponse:
      type: object
      properties:
        id:
          type: string
          description: Region ID (may be a numeric code string, not necessarily a UUID)
          example: "3273"
        name:
          type: string
          example: "Kota Bandung"
        latitude:
          type: number
          format: double
          nullable: true
          example: -6.9175
        longitude:
          type: number
          format: double
          nullable: true
          example: 107.6191
        location_elv:
          type: integer
          nullable: true
          description: Elevation in metres above sea level
        location_tz:
          type: integer
          nullable: true
          description: UTC offset in minutes (e.g. 420 for WIB UTC+7)
        location_path:
          type: array
          items:
            type: string
          description: Hierarchical path from root to this region
          example: ["32", "3273"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PaginatedRegionResponse:
      type: object
      required: [success, data, pagination]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/RegionResponse"
        pagination:
          $ref: "#/components/schemas/PaginationMeta"

    # ── Event Series ──────────────────────────────────────────────────────
    EventSeriesResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Event series UUID
        slug:
          type: string
          nullable: true
          description: URL-friendly identifier
        name:
          $ref: "#/components/schemas/L10nString"
        description:
          allOf:
            - $ref: "#/components/schemas/L10nString"
          nullable: true
        subject_id:
          type: string
          format: uuid
          nullable: true
        place_id:
          type: string
          format: uuid
        asatidz_id:
          type: string
          format: uuid
        reference_id:
          type: string
          format: uuid
          nullable: true
        date_start:
          type: string
          format: date-time
          description: Series start date
        date_end:
          type: string
          format: date-time
          nullable: true
          description: Series end date (null for open-ended series)
        date_prayer:
          type: integer
          description: Prayer time reference integer (domain-specific encoding)
        date_rule:
          type: string
          nullable: true
          description: Recurrence rule string (iCal RRULE format or custom)
        event_type:
          type: integer
          description: Event type integer (domain-specific encoding)
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        place:
          allOf:
            - $ref: "#/components/schemas/PlaceResponse"
          nullable: true
          description: Full place object. Present only when `?expand=place` is requested.
        asatidz:
          allOf:
            - $ref: "#/components/schemas/AsatidzResponse"
          nullable: true
          description: Full asatidz object. Present only when `?expand=asatidz` is requested.

    # ── Event Recurring (occurrence) ──────────────────────────────────────
    EventRecurringResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Occurrence integer ID
        event_id:
          type: string
          format: uuid
          description: Parent event series UUID
        name:
          allOf:
            - $ref: "#/components/schemas/L10nString"
          nullable: true
          description: Override name (null when inherited from the series)
        description:
          allOf:
            - $ref: "#/components/schemas/L10nString"
          nullable: true
          description: Override description (null when inherited from the series)
        asatidz_id:
          type: string
          format: uuid
          nullable: true
          description: Override asatidz (null when inherited from the series)
        place_id:
          type: string
          format: uuid
          nullable: true
          description: Override place (null when inherited from the series)
        date_start:
          type: string
          format: date-time
        date_end:
          type: string
          format: date-time
          nullable: true
        date_prayer:
          type: integer
        status:
          type: integer
          description: "Occurrence status: Incoming=0, Ongoing=1, Cancelled=10, Rescheduled=11, Completed=99"
        going_count:
          type: integer
          description: Number of users who marked as going
        is_modified:
          type: boolean
          description: True when this occurrence has been overridden from the series default
        cancellation_reason:
          type: string
          nullable: true
        distance_km:
          type: number
          format: double
          nullable: true
          description: Distance from search origin in km (populated only in /events/nearby responses)
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        place:
          allOf:
            - $ref: "#/components/schemas/PlaceResponse"
          nullable: true
          description: |
            Full place object. Present only when `?expand=place` is requested.
            Resolved from the occurrence's own place_id if set, otherwise from
            the parent event series place_id (effective ID).
        asatidz:
          allOf:
            - $ref: "#/components/schemas/AsatidzResponse"
          nullable: true
          description: |
            Full asatidz object. Present only when `?expand=asatidz` is requested.
            Resolved from the occurrence's own asatidz_id if set, otherwise from
            the parent event series asatidz_id (effective ID).

    PaginatedEventRecurringResponse:
      type: object
      required: [success, data, pagination]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/EventRecurringResponse"
        pagination:
          $ref: "#/components/schemas/PaginationMeta"

    # ── Author ────────────────────────────────────────────────────────────
    AuthorResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          $ref: "#/components/schemas/L10nString"
        bio:
          allOf:
            - $ref: "#/components/schemas/L10nString"
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PaginatedAuthorResponse:
      type: object
      required: [success, data, pagination]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/AuthorResponse"
        pagination:
          $ref: "#/components/schemas/PaginationMeta"

    # ── Subject ───────────────────────────────────────────────────────────
    SubjectResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          $ref: "#/components/schemas/L10nString"
        description:
          allOf:
            - $ref: "#/components/schemas/L10nString"
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PaginatedSubjectResponse:
      type: object
      required: [success, data, pagination]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/SubjectResponse"
        pagination:
          $ref: "#/components/schemas/PaginationMeta"

    # ── Asatidz ───────────────────────────────────────────────────────────
    AsatidzResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          $ref: "#/components/schemas/L10nString"
        alias_name:
          allOf:
            - $ref: "#/components/schemas/L10nString"
          nullable: true
        gender:
          type: integer
          description: "1 = Male, 2 = Female"
          enum: [1, 2]
        description:
          allOf:
            - $ref: "#/components/schemas/L10nString"
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PaginatedAsatidzResponse:
      type: object
      required: [success, data, pagination]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/AsatidzResponse"
        pagination:
          $ref: "#/components/schemas/PaginationMeta"

    # ── Place ─────────────────────────────────────────────────────────────
    PlaceResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          $ref: "#/components/schemas/L10nString"
        description:
          allOf:
            - $ref: "#/components/schemas/L10nString"
          nullable: true
        phone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        region_id:
          type: string
          format: uuid
          nullable: true
        lat:
          type: number
          format: double
          nullable: true
          description: Latitude (WGS-84)
        lng:
          type: number
          format: double
          nullable: true
          description: Longitude (WGS-84)
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PaginatedPlaceResponse:
      type: object
      required: [success, data, pagination]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/PlaceResponse"
        pagination:
          $ref: "#/components/schemas/PaginationMeta"

    # ── Reference ─────────────────────────────────────────────────────────
    ReferenceResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          $ref: "#/components/schemas/L10nString"
        description:
          allOf:
            - $ref: "#/components/schemas/L10nString"
          nullable: true
        author_id:
          type: string
          format: uuid
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PaginatedReferenceResponse:
      type: object
      required: [success, data, pagination]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/ReferenceResponse"
        pagination:
          $ref: "#/components/schemas/PaginationMeta"
