name: E2E

# Playwright runs as a non-blocking signal in Phase 1 (continue-on-error).
# Becomes a required check in Phase 5 — see docs/roadmap.md.
on:
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: playwright smoke
    runs-on: ubuntu-latest
    continue-on-error: true
    # Build-time placeholders so the SvelteKit webServer build (which imports
    # STADIA_API_KEY + UPSTREAM_API_URL from $env/static/private) can start.
    # Mirrors the ci.yml build job; smoke tests hit no real upstream/tiles.
    env:
      UPSTREAM_API_URL: https://upstream.example.com
      STADIA_API_KEY: ci-build-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Codegen (paraglide)
        run: bun run codegen
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Run smoke
        run: bun run test:e2e
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
